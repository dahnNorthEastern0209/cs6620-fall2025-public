
name: Deploy Topic 7 Website to S3

on:
  push:
    branches:
      - week02
    paths:
      - "topic7-s3-website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy website to S3
        run: |
          aws s3 sync ./topic7-s3-website \
            s3://cs6620-davidahn-topic7-site-2026

      - name: Verify website
        run: |
          curl --fail --silent --show-error \
            http://cs6620-davidahn-topic7-site-2026.s3-website-us-east-1.amazonaws.com/
